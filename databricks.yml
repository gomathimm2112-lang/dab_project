# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 3f348a60-bb0d-49fc-94e0-ebedecf2eca5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405611280492485.5.azuredatabricks.net

    
  test:
    mode: production
    variables:
      catalog: 
        default: "citibike_test"
    presets:
      name_prefix: '[test]'
    workspace:
      host: https://adb-7405608591548359.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/gomathimm2112@gmail.com to make sure we only have a single copy.
      root_path: /Workspace//Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: 498f1d18-58cc-4092-8ff3-af83305a2580
      #- service_principal_name: sp-databricks-test-uksouth
        level: CAN_MANAGE
    run_as:
      service_principal_name: 498f1d18-58cc-4092-8ff3-af83305a2580
  

  prod:
    mode: production
    variables:
      catalog: 
        default: "citibike_prod"
    presets:
      name_prefix: '[prod]'
    workspace:
      host: https://adb-7405619216695504.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/gomathimm2112@gmail.com to make sure we only have a single copy.
      root_path: /Workspace//Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: 0024b79c-e30f-479c-87a1-af157ef21d4e
      #- service_principal_name: sp-databricks-test-uksouth
        level: CAN_MANAGE
    run_as:
      service_principal_name: 0024b79c-e30f-479c-87a1-af157ef21d4e
